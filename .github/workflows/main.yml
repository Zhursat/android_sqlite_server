name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'optimization/**'
      - 'maintenance/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-30"
          sdkmanager "build-tools;30.0.3"

      - name: Install Gradle 8.2
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Prepare persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SOLAR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SOLAR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure SOLAR_KEYSTORE_BASE64 and SOLAR_KEYSTORE_PASSWORD in repository secrets"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/solar-monitor-release.jks"
          echo "SOLAR_SIGNING_KEYSTORE=$RUNNER_TEMP/solar-monitor-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Debug APK
        env:
          SOLAR_SIGNING_PASSWORD: ${{ secrets.SOLAR_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-persistently-signed
          path: app/build/outputs/apk/debug/app-debug.apk
