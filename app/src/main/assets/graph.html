<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Історія споживання/виробництва електроенергії JSD Solar J4000HC</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>

<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: sans-serif;
  }

  .wrap {
    padding: 14px;
  }

  h2 {
    margin: 0 0 12px 0;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  select, button {
    background: #1b1b1b;
    color: #fff;
    border: 1px solid #444;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
  }

  button {
    cursor: pointer;
  }

  .hint {
    color: #aaa;
    font-size: 13px;
  }

  .chart-box {
    position: relative;
    height: calc(100vh - 130px);
    min-height: 420px;
  }
</style>
</head>
<body>

<div class="wrap">
  <h2>Solar Monitor PRO</h2>

  <div class="toolbar">
    <select id="range">
      <option value="1">1 доба</option>
      <option value="7">7 діб</option>
      <option value="30">1 місяць</option>
      <option value="180">6 місяців</option>
    </select>

    <button id="btnLast5h">Останні 5 годин</button>
    <button id="btnResetZoom">Скинути zoom</button>

    <span class="hint">Колесо/пальці — zoom, перетягування — прокрутка</span>
  </div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>
</div>

<script>
const SERVER_URL = '/api/history';

const chart = new Chart(document.getElementById('chart').getContext('2d'), {
  type: 'line',
  data: {
    datasets: [
      {
        label: 'Сонце',
        data: [],
        borderColor: 'rgb(255, 255, 0)',
        backgroundColor: 'rgba(255, 255, 0, 0.1)',
        fill: true,
        pointRadius: 2,
        pointHoverRadius: 4,
        tension: 0.5
      },
      {
        label: 'Споживання',
        data: [],
        borderColor: 'rgb(0, 255, 0)',
        backgroundColor: 'rgba(0, 255, 0, 0.1)',
        fill: true,
        pointRadius: 2,
        pointHoverRadius: 4,
        tension: 0.5
      },
      {
        label: 'АКБ',
        data: [],
        borderColor: 'rgb(0, 255, 255)',
        backgroundColor: 'rgba(0, 255, 255, 0.1)',
        fill: true,
        yAxisID: 'y1',
        pointRadius: 2,
        pointHoverRadius: 4,
        tension: 0.3
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    normalized: true,
    parsing: false,
    interaction: {
      mode: 'index',
      intersect: false
    },
    plugins: {
      legend: {
        labels: {
          color: '#ddd'
        }
      },
      tooltip: {
        callbacks: {
          title(items) {
            if (!items.length) return '';
            const x = items[0].raw.x;
            const d = new Date(x);
            return d.toLocaleString('uk-UA', {
              day: '2-digit',
              month: '2-digit',
              hour: '2-digit',
              minute: '2-digit'
            });
          }
        }
      },
      zoom: {
        limits: {
          x: { minRange: 5 * 60 * 1000 }
        },
        pan: {
          enabled: true,
          mode: 'x',
          threshold: 5
        },
        zoom: {
          wheel: {
            enabled: true
          },
          pinch: {
            enabled: true
          },
          drag: {
            enabled: true,
            backgroundColor: 'rgba(150,150,150,0.15)',
            borderColor: 'rgba(200,200,200,0.3)',
            borderWidth: 1
          },
          mode: 'x'
        }
      }
    },
    scales: {
      x: {
        type: 'linear',
        ticks: {
          color: '#999',
          maxRotation: 55,
          minRotation: 55,
          callback: function(value) {
            const d = new Date(value);
            return d.toLocaleString('uk-UA', {
              day: '2-digit',
              month: '2-digit',
              hour: '2-digit',
              minute: '2-digit'
            });
          }
        },
        grid: {
          color: 'rgba(255,255,255,0.05)'
        }
      },
      y: {
        position: 'left',
        title: {
          display: true,
          text: 'Вт',
          color: '#aaa'
        },
        ticks: {
          color: '#999'
        },
        grid: {
          color: 'rgba(255,255,255,0.05)'
        }
      },
      y1: {
        position: 'right',
        min: 0,
        max: 100,
        title: {
          display: true,
          text: '%',
          color: '#aaa'
        },
        ticks: {
          color: '#999'
        },
        grid: {
          drawOnChartArea: false
        }
      }
    }
  }
});

let currentDataRange = null;
let autoRefreshTimer = null;
let loadedRange = null;
let lastRefreshAt = null;
let activeRequest = null;
let requestVersion = 0;

function getRange() {
  const days = parseInt(document.getElementById('range').value, 10);
  let start, end;

  if (days === 1) {
    start = new Date();
    start.setHours(0, 0, 0, 0);

    end = new Date(); // до поточного моменту
  } else {
    end = new Date();
    end.setHours(23, 59, 59, 999);

    start = new Date(end);
    start.setDate(start.getDate() - (days - 1));
    start.setHours(0, 0, 0, 0);
  }

  return {
    days,
    from: Math.floor(start.getTime() / 1000),
    to: Math.floor(end.getTime() / 1000)
  };
}

function getStep(days) {
  if (days === 1) return 60;       // 1 хв
  if (days === 7) return 300;      // 5 хв
  if (days === 30) return 900;     // 15 хв
  return 3600;                     // 1 година
}

// The server already returns equally spaced averages (including empty buckets).
function buildSeries(averagedData) {
  const pvSeries = [];
  const loadSeries = [];
  const socSeries = [];

  for (const p of averagedData) {
    const x = p.ts * 1000;
    pvSeries.push({ x, y: p.pv });
    loadSeries.push({ x, y: p.load });
    socSeries.push({ x, y: p.soc });
  }

  return { pvSeries, loadSeries, socSeries };
}

function applyLast5HoursWindow() {
  if (!currentDataRange) return;

  const nowMs = Date.now();
  const fiveHoursAgoMs = nowMs - (5 * 60 * 60 * 1000);

  const min = Math.max(fiveHoursAgoMs, currentDataRange.minMs);
  const max = Math.min(nowMs, currentDataRange.maxMs);

  chart.options.scales.x.min = min;
  chart.options.scales.x.max = max > min ? max : currentDataRange.maxMs;
  chart.update('none');
}

function resetZoomFullRange() {
  if (!currentDataRange) return;

  chart.resetZoom();
  chart.options.scales.x.min = currentDataRange.minMs;
  chart.options.scales.x.max = currentDataRange.maxMs;
  chart.update('none');
}

async function loadData(keepWindow = true) {
  const version = ++requestVersion;
  if (activeRequest) activeRequest.abort();
  const controller = new AbortController();
  activeRequest = controller;
  const startedAt = Math.floor(Date.now() / 1000);

  try {
    const previousMin = chart.options.scales.x.min;
    const previousMax = chart.options.scales.x.max;
    const rangeInfo = getRange();
    const step = getStep(rangeInfo.days);
    const res = await fetch(`${SERVER_URL}?from=${rangeInfo.from}&to=${rangeInfo.to}&step=${step}`,
                            { signal: controller.signal });
    if (!res.ok) throw new Error(`History request failed: ${res.status}`);

    const averagedData = await res.json();
    if (version !== requestVersion) return;

    const { pvSeries, loadSeries, socSeries } = buildSeries(averagedData);
    chart.data.datasets[0].data = pvSeries;
    chart.data.datasets[1].data = loadSeries;
    chart.data.datasets[2].data = socSeries;

    loadedRange = { ...rangeInfo, step };
    lastRefreshAt = startedAt;
    currentDataRange = {
      minMs: rangeInfo.from * 1000,
      maxMs: rangeInfo.to * 1000
    };

    if (keepWindow && previousMin != null && previousMax != null) {
      chart.options.scales.x.min = previousMin;
      chart.options.scales.x.max = previousMax;
      chart.update('none');
    } else {
      applyLast5HoursWindow();
    }
  } catch (error) {
    if (error.name !== 'AbortError') console.error('History load failed:', error);
  } finally {
    if (activeRequest === controller) activeRequest = null;
  }
}

// Refresh only the buckets that may have changed since our last query.
// On a new calendar day or another date-range change, reload the full range.
async function refreshLatestBuckets() {
  if (document.hidden || activeRequest) return;

  const rangeInfo = getRange();
  if (!loadedRange ||
      loadedRange.days !== rangeInfo.days ||
      loadedRange.from !== rangeInfo.from ||
      rangeInfo.to < loadedRange.to ||
      lastRefreshAt == null) {
    await loadData(false);
    return;
  }

  const to = Math.min(Math.floor(Date.now() / 1000), rangeInfo.to);
  if (to < lastRefreshAt) {
    await loadData(true);
    return;
  }

  const step = loadedRange.step;
  const firstBucket = Math.max(0, Math.floor((lastRefreshAt - rangeInfo.from) / step));
  const from = rangeInfo.from + firstBucket * step;
  if (from > to) return;

  const controller = new AbortController();
  const version = requestVersion;
  activeRequest = controller;

  try {
    const res = await fetch(`${SERVER_URL}?from=${from}&to=${to}&step=${step}`,
                            { signal: controller.signal });
    if (!res.ok) throw new Error(`History refresh failed: ${res.status}`);

    const updates = await res.json();
    if (version !== requestVersion) return;

    const datasets = chart.data.datasets;
    for (const point of updates) {
      const index = (point.ts - rangeInfo.from) / step;
      if (!Number.isInteger(index) || index < 0 || index >= 10000) continue;

      // Today grows by one point as a new minute begins; longer ranges
      // already contain the empty future buckets and need replacements only.
      while (datasets[0].data.length <= index) {
        const x = (rangeInfo.from + datasets[0].data.length * step) * 1000;
        for (const dataset of datasets) dataset.data.push({ x, y: 0 });
      }

      const x = point.ts * 1000;
      datasets[0].data[index] = { x, y: point.pv };
      datasets[1].data[index] = { x, y: point.load };
      datasets[2].data[index] = { x, y: point.soc };
    }

    loadedRange.to = rangeInfo.to;
    lastRefreshAt = to;
    currentDataRange.maxMs = rangeInfo.to * 1000;
    chart.update('none');
  } catch (error) {
    if (error.name !== 'AbortError') console.error('History refresh failed:', error);
  } finally {
    if (activeRequest === controller) activeRequest = null;
  }
}

function getRefreshPeriod(days) {
  if (days === 1) return 5000;
  if (days === 7) return 30000;
  if (days === 30) return 60000;
  return 300000;
}

function restartAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(refreshLatestBuckets,
    getRefreshPeriod(getRange().days));
}

document.getElementById('range').addEventListener('change', () => {
  restartAutoRefresh();
  loadData(false);
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshLatestBuckets();
});

document.getElementById('btnLast5h').addEventListener('click', () => {
  applyLast5HoursWindow();
});

document.getElementById('btnResetZoom').addEventListener('click', () => {
  resetZoomFullRange();
});

(async function init() {
  await loadData(false);
  restartAutoRefresh();
})();
</script>

</body>
</html>
